##################################################################################################
# OCP SRV CMS - Valkey Server Configuration (single node, local memtier client)
#
# Derived from a production 3-node cluster config, adapted for a single standalone instance:
#   - cluster-enabled removed (memtier runs without --cluster-mode)
#   - bound to loopback; the memtier client runs in the same container
#
# maxmemory, maxmemory-policy, appendonly, io-threads, dir and logfile are passed on the
# valkey-server command line by run_valkey_memtier.sh from the .env file, overriding this file.
##################################################################################################

port 6379
bind 127.0.0.1
protected-mode no
daemonize no

# Memory
maxmemory 2576980377
maxmemory-policy allkeys-lru
lazyfree-lazy-expire yes

# Persistence: AOF on, RDB snapshots off
appendonly yes
save ""

# Clients
timeout 1800
maxclients 10000

# Replication (inert on a single node, kept to match the production config)
repl-diskless-sync yes
repl-diskless-sync-delay 0

# Background task frequency
hz 100

# Diagnostics
slowlog-log-slower-than 10000
slowlog-max-len 1024
latency-monitor-threshold 0
